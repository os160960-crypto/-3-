<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step02_Array1.html</title>
</head>
<body>
    <script>
        /* [ Array type ]
            - []를 이용해서 만든다.
            - 순서가 중요한 데이터를 담는다.
            - 0부터 시작되는 인덱스가 자동으로 부여된다.
        */
        // 숫자 배열에 담기 (순서 0 , 1 , 2 , 3 , 4)
        var nums = [10,20,30,40,50];

        // 문자열 배열에 담기
        var names = ['짱구', '짱아', '흰둥이', '철수'];

        console.log(nums[0]);
        //인덱스 수정
        names[2] = '훈이';
        console.log (names);
        
        // 특정 인덱스 삭제
        names.splice(2, 1); 
        console.log (names);

        // 배열에 데이터 추가 
        names.push ('맹구');
        console.log (names);

        // 가장 마지막 인덱스에 있는 데이터 삭제 
        names.pop();
        console.log (names);

        // 배열안에 아이템 개수
        console.log(nums.length);

        // 새로운 배결로 반환
        var nums2 =nums.map(function(arr){
            return arr * 2;
        });
        console.log(nums2);


    </script>
</body>
</html>
