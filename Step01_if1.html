<body>
    <script>
        /*
            [IF문]

            if (true) {
                실행문
            }

            if(false) {
                실행문1
            } else if(true) {
                실행문2
            } else if(true) {
                실행문3
            } else {
                실행문4
            }
        */

        var num = 1;

        if(num == 2) {
            document.write("1이 맞음");
        } else if(num == 3) {
            document.write("1이 맞음"); 
        }
        else {
            document.write('무조건 아님');
        }

    </script>
