<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step02_Array2.html</title>
</head>
<body>
    <div id='div1'>div1</div>
    <div id='div2'>div2</div>
    <div id='div3'>div3</div>
    <div id='div4'>div4</div>
    <div id='div5'>div5</div>
    <button onclick="change()" onmouseout="recover()">CHANGE</button>

    <script>
        var names = ['짱구', '짱아' , '흰둥이', '철수', '훈이'];

        //클릭 시에 names 배열의 이름이 각각의 div에 들어가게 하기
        var change = function(){
            document.getElementById('div1').innerHTML = names[1];
            document.getElementById('div2').innerHTML = names[0];
            document.getElementById('div3').innerHTML = names[3];
            document.getElementById('div4').innerHTML = names[4];
            document.getElementById('div5').innerHTML = names[2];
        }
    
        
        // 마우스아웃 시에 각각의 dic가 다시 div1, div2,... 돌아오게 하기
        var recover = function(){
            document.getElementById('div1').innerHTML = 'div1';
            document.getElementById('div2').innerHTML = 'div2';
            document.getElementById('div3').innerHTML = 'div3';
            document.getElementById('div4').innerHTML = 'div4';
            document.getElementById('div5').innerHTML = 'div5';
        }
    </script>
</body>
</html>
